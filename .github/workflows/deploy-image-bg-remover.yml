name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'image-background-remover/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: image-background-remover
        run: pnpm install --no-frozen-lockfile

      - name: Build for Cloudflare Pages
        working-directory: image-background-remover
        run: pnpm run pages:build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: image-background-remover
          command: pages deploy .open-next/assets --project-name=image-background-remover --commit-dirty=true
