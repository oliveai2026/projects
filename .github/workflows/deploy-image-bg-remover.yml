name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'image-background-remover/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: image-background-remover/package-lock.json

      - name: Install dependencies
        working-directory: image-background-remover
        run: npm ci --legacy-peer-deps

      - name: Build for Cloudflare Pages
        working-directory: image-background-remover
        run: npx @cloudflare/next-on-pages
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy image-background-remover/.vercel/output/static --project-name=image-background-remover --commit-dirty=true
